[package]
name = "chatd"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Durable local message broker between coding agents (plan 0001)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "chatd"
path = "src/bin/chatd.rs"

[[bin]]
name = "chatctl"
path = "src/bin/chatctl.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
sha2 = "0.10"
toml = "0.8"

[profile.release]
debug = 1
